<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vila das Contas</title>
<meta name="description" content="Jogo 3D de matemática para crianças de 5 a 7 anos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
/* Layout: cena 3D em tela cheia; HUD em camadas fixas por cima, botões grandes nas bordas. */
:root{
  --sky:#bfe6f5; --ink:#2b2a4a; --paper:#fffaf0; --sun:#ffc53d; --sun-deep:#f2a516;
  --leaf:#3fa45b; --berry:#e5487a; --sea:#2f7fd0; --line:#e8dcc4; --muted:#6b6890;
  --shadow:0 6px 0 rgba(43,42,74,.18);
  --display:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:"Nunito","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
[hidden]{display:none!important}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sky);color:var(--ink);font-family:var(--body);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#scene{position:fixed;inset:0;touch-action:none}
#scene canvas{display:block;width:100%;height:100%}
button{font-family:var(--display);color:var(--ink);cursor:pointer;border:0;touch-action:manipulation}
button:focus-visible{outline:4px solid var(--sea);outline-offset:3px}
.big-btn{min-width:68px;min-height:68px;border-radius:22px;background:var(--paper);box-shadow:var(--shadow);font-size:34px;display:grid;place-items:center;transition:transform .12s}
.big-btn:active{transform:translateY(3px);box-shadow:0 3px 0 rgba(43,42,74,.18)}
.big-btn small{display:block;font-size:12px;font-family:var(--body);font-weight:800;color:var(--muted);margin-top:-6px}

/* Barra do topo durante a missão */
#topbar{position:fixed;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top,0px) + 12px) 16px 0;display:flex;align-items:flex-start;justify-content:space-between;gap:12px;pointer-events:none;z-index:20}
#topbar>*{pointer-events:auto}
#steps{display:flex;gap:6px;background:rgba(255,250,240,.9);padding:6px;border-radius:999px;box-shadow:var(--shadow)}
.step{display:flex;align-items:center;gap:4px;padding:6px 12px;border-radius:999px;font-family:var(--display);font-weight:800;font-size:15px;color:var(--muted)}
.step i{font-style:normal;font-size:22px}
.step.on{background:var(--sun);color:var(--ink)}
.step.done{color:var(--leaf)}
#probs{display:flex;gap:6px;justify-content:center;margin-top:8px}
#probs span{width:14px;height:14px;border-radius:50%;background:rgba(255,250,240,.8);border:2px solid var(--ink)}
#probs span.ok{background:var(--leaf);border-color:var(--leaf)}
#probs span.now{background:var(--sun)}
.tb-group{display:flex;gap:10px}
#btn-dica .tico-face{width:40px;height:40px}
#btn-dica.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.08)}}

/* Legenda */
#legenda{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 14px);max-width:min(860px,calc(100% - 32px));background:rgba(43,42,74,.86);color:#fff;font-size:clamp(16px,2.3vw,22px);line-height:1.35;font-weight:700;padding:10px 18px;border-radius:16px;z-index:25;pointer-events:none;text-align:center}
#legenda b{color:var(--sun)}
#legenda:empty{display:none}
body.answering #legenda{bottom:calc(env(safe-area-inset-bottom,0px) + 186px)}

/* Cartões de resposta */
#answer{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:12px;flex-wrap:wrap;padding:0 16px;z-index:22}
.card{width:clamp(78px,11vw,118px);height:clamp(110px,15vw,156px);background:var(--paper);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px;border:4px solid transparent;animation:pop .35s both}
.card:nth-child(2){animation-delay:.05s}.card:nth-child(3){animation-delay:.1s}.card:nth-child(4){animation-delay:.15s}.card:nth-child(5){animation-delay:.2s}.card:nth-child(6){animation-delay:.25s}
.card .num{font-family:var(--display);font-weight:800;font-size:clamp(40px,6vw,64px);line-height:1}
.card.l1 .num{font-size:22px;color:var(--muted)}
.card.wrong{opacity:.45;border-color:var(--line)}
.card.right{border-color:var(--leaf)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center}
.frame{display:grid;grid-template-columns:repeat(5,var(--d,11px));gap:3px}
.frame i{width:var(--d,11px);height:var(--d,11px);border-radius:50%;background:var(--ink)}
.card.l1 .frame{--d:16px}

/* Quadro: desenho + conta */
#board{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 112px);transform:translateX(-50%);width:min(900px,calc(100% - 32px));max-height:calc(100% - 200px);overflow:auto;background:var(--paper);border-radius:28px;box-shadow:0 10px 0 rgba(43,42,74,.15),0 20px 60px rgba(43,42,74,.25);padding:20px;z-index:21;box-sizing:border-box}
#draw{display:flex;flex-wrap:wrap;gap:18px;justify-content:center;align-items:flex-end}
.grp{display:flex;flex-direction:column;align-items:center;gap:6px;animation:pop .4s both}
.grp .figs{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;max-width:290px;padding:8px;border-radius:16px;border:3px solid transparent}
.grp.box .figs{border-color:currentColor;border-style:solid}
.grp .lbl{font-family:var(--display);font-weight:800;font-size:15px}
.grp .rows{display:flex;flex-direction:column;gap:6px}
.fig{width:38px;height:38px;display:grid;place-items:center;font-size:28px;line-height:1;position:relative}
.fig svg{width:36px;height:36px}
.fig span{font-size:30px}
.fig.crossed::after{content:"";position:absolute;inset:2px;background:linear-gradient(45deg,transparent 44%,var(--berry) 44% 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,var(--berry) 44% 56%,transparent 56%)}
.fig.crossed>*{opacity:.45}
.fig.empty>*{opacity:0}
.fig.empty{border:3px dashed var(--muted);border-radius:50%;width:28px;height:28px;margin:3px}
.op-sign{font-family:var(--display);font-weight:800;font-size:40px;align-self:center}
#eq{margin-top:16px;display:flex;flex-direction:column;align-items:center;gap:8px}
.eqline{display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap;justify-content:center;font-family:var(--display);font-weight:800}
.eqline.words{font-size:clamp(18px,2.6vw,26px);color:var(--muted)}
.eqline.main{font-size:clamp(40px,7vw,72px);line-height:1}
.tok{display:flex;flex-direction:column;align-items:center;gap:4px;padding:0 4px;border-bottom:6px solid transparent;animation:pop .35s both}
.tok .frame{--d:8px;gap:2px}
.eqline.extra{font-size:clamp(22px,3.4vw,34px);color:var(--muted)}
#builder{margin-top:14px;display:flex;flex-direction:column;align-items:center;gap:14px}
#slots{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:center}
.slot{min-width:66px;height:78px;border-radius:16px;border:4px dashed var(--muted);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:44px;background:#fff}
.slot.op{min-width:56px}
.slot.filled{border-style:solid;border-color:var(--sea)}
.slot.fixed{border:0;background:none;min-width:auto}
.slot.bad{border-color:var(--berry);animation:shake .4s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#tiles{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.tile{min-width:64px;height:84px;padding:4px 8px;border-radius:16px;background:var(--sun);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;font-size:38px}
.tile.op{background:#d9ecff;font-size:44px}
.tile .frame{--d:7px;gap:2px}
.board-actions{display:flex;gap:12px;justify-content:center;margin-top:14px}
.go{min-height:68px;padding:0 26px;border-radius:22px;background:var(--leaf);color:#fff;font-size:30px;font-weight:800;box-shadow:var(--shadow);display:flex;align-items:center;gap:10px}
.go.alt{background:var(--paper);color:var(--ink)}

/* Estratégia */
#strategy{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:center;gap:16px;flex-wrap:wrap;padding:0 16px;z-index:23}
.strat{width:150px;min-height:130px;border-radius:24px;background:var(--paper);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:15px;font-weight:800;animation:pop .35s both;padding:8px}
.strat svg{width:84px;height:64px}

/* Praça */
#pins{position:fixed;inset:0;pointer-events:none;z-index:10}
.pin{position:absolute;transform:translate(-50%,-100%);pointer-events:auto;display:flex;flex-direction:column;align-items:center;gap:2px;background:none}
.pin .bubble{width:76px;height:76px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:grid;place-items:center;font-size:42px;position:relative;border:4px solid var(--paper)}
.pin.next .bubble{border-color:var(--sun);animation:pulse 1.3s ease-in-out infinite}
.pin.locked .bubble{filter:grayscale(1);opacity:.75}
.pin .lock{position:absolute;right:-6px;bottom:-6px;font-size:24px}
.pin .stars{font-size:16px;letter-spacing:-2px;min-height:18px;text-shadow:0 1px 0 #fff}
.pin .tail{width:0;height:0;border:10px solid transparent;border-top-color:var(--paper);margin-top:-4px}
#praca-hud{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);display:flex;justify-content:space-between;align-items:flex-end;z-index:12;pointer-events:none}
#praca-hud>*{pointer-events:auto}
#praca-hud .tb-group{align-items:flex-end}
#who{font-size:40px}
#btn-adulto{min-width:52px;min-height:52px;font-size:24px;opacity:.85}
#btn-festa{background:var(--sun);font-size:44px}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:15}
.floater{position:absolute;transform:translate(-50%,-100%);font-family:var(--display);font-weight:800;font-size:40px;color:#fff;text-shadow:0 3px 0 var(--ink),0 0 10px rgba(43,42,74,.5);animation:floatup 1.3s ease-out forwards}
@keyframes floatup{from{opacity:0;margin-top:10px}20%{opacity:1}to{opacity:0;margin-top:-50px}}

/* Telas cheias */
.screen{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 16px;box-sizing:border-box;overflow:auto}
#start{background:linear-gradient(180deg,rgba(191,230,245,.2),rgba(191,230,245,.85) 60%)}
#start h1{font-family:var(--display);font-weight:800;font-size:clamp(46px,9vw,96px);line-height:.9;margin:0;color:var(--ink);text-align:center;text-shadow:0 5px 0 #fff;text-wrap:balance}
#start h1 span{color:var(--sun-deep)}
#start p.sub{margin:0;font-weight:800;font-size:18px;color:var(--muted);text-align:center}
#profiles{display:grid;grid-template-columns:repeat(5,minmax(0,96px));gap:14px;max-width:100%}
.prof{aspect-ratio:1;border-radius:26px;background:var(--paper);box-shadow:var(--shadow);font-size:48px;display:grid;place-items:center;position:relative}
.prof small{position:absolute;bottom:4px;font-size:11px;font-family:var(--body);font-weight:800;color:var(--muted);max-width:90%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#start .adult-link{position:absolute;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
@media (max-width:560px){#profiles{grid-template-columns:repeat(3,minmax(0,96px))}.step b{display:none}#steps{gap:2px}.step{padding:6px 8px}}

#gate{background:rgba(43,42,74,.88);color:#fff;flex-direction:row;justify-content:space-between}
#gate .gtxt{text-align:center;max-width:420px;font-weight:700;font-size:18px}
#gate .gtxt h2{font-family:var(--display);margin:0 0 8px;font-size:28px}
.hold{width:110px;height:110px;border-radius:50%;background:var(--paper);font-size:40px;flex:none;position:relative}
.hold.on{background:var(--sun)}
#gate-bar{height:10px;background:rgba(255,255,255,.2);border-radius:10px;overflow:hidden;margin-top:14px}
#gate-bar i{display:block;height:100%;width:0;background:var(--sun)}

#teacher,#album{background:var(--paper);justify-content:flex-start;align-items:stretch;z-index:45}
.panel-wrap{max-width:1000px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:18px;padding-bottom:40px}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.panel-head h2{font-family:var(--display);font-size:32px;margin:0}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tabs button{padding:10px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-size:17px;font-weight:800}
.tabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.kid{border:2px solid var(--line);border-radius:20px;padding:16px;background:#fff;display:flex;flex-direction:column;gap:12px}
.kid-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.kid-head .av{font-size:40px}
.kid-head input{font:inherit;font-weight:800;font-size:18px;padding:6px 10px;border-radius:10px;border:2px solid var(--line);min-width:0;width:180px}
.grid-locs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.loc-cell{border-radius:14px;background:var(--paper);padding:10px;display:flex;flex-direction:column;gap:6px;font-size:14px}
.loc-cell b{font-family:var(--display);font-size:17px}
.loc-cell select{font:inherit;padding:4px;border-radius:8px}
.ideas{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 18px;font-size:14px}
.idea{display:flex;align-items:center;gap:8px}
.idea>span{white-space:nowrap}
.idea .bar{flex:1;height:10px;background:#f1e9da;border-radius:10px;overflow:hidden;display:flex}
.idea .bar i{background:var(--leaf)}.idea .bar u{background:var(--berry)}
.chip{font-size:12px;font-weight:800;padding:2px 8px;border-radius:999px;background:#e5f4e9;color:#21733b;white-space:nowrap}
.chip.warn{background:#fde6ee;color:#a3204f}
.note{background:#fff7dd;border-radius:14px;padding:10px 14px;font-size:15px}
.set-row{display:flex;align-items:center;gap:14px;flex-wrap:wrap;font-weight:800;font-size:17px;padding:10px 0;border-bottom:1px solid var(--line)}
.set-row label{min-width:150px}
.set-row input[type=range]{width:220px;max-width:100%}
.set-row input[type=checkbox]{width:26px;height:26px}
.plain{padding:12px 18px;border-radius:14px;background:#fff;border:2px solid var(--line);font-size:17px;font-weight:800}
.plain.danger{border-color:var(--berry);color:var(--berry)}
textarea#csv{width:100%;min-height:160px;font-family:ui-monospace,Consolas,monospace;font-size:13px;border-radius:12px;border:2px solid var(--line);padding:10px;box-sizing:border-box;-webkit-user-select:text;user-select:text}
.stickers{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.sticker{aspect-ratio:3/4;border-radius:20px;background:#fff;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:5px solid var(--sun);font-family:var(--display);font-weight:800;font-size:18px;text-align:center;padding:8px}
.sticker .face{font-size:64px;line-height:1}
.sticker.off{border-color:var(--line);filter:grayscale(1);opacity:.5}
.sticker .st{font-size:15px;color:var(--sun-deep)}
#toast{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:60;pointer-events:none}
#toast .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,8vw,84px);color:#fff;text-shadow:0 5px 0 var(--ink);animation:pop .5s both;text-align:center}
#loading{position:fixed;inset:0;background:var(--sky);display:grid;place-items:center;z-index:100;font-family:var(--display);font-size:28px;font-weight:800;text-align:center;padding:16px}
.tico-face{display:block;width:100%;height:auto}
.sticker .tico-face{width:72px;height:72px}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
@media print{body{overflow:visible;background:#fff}#scene,#pins,#praca-hud,#topbar,#legenda{display:none!important}#teacher{position:static}}
</style>

<div id="scene"></div>
<div id="pins"></div>
<div id="floaters"></div>

<header id="topbar" hidden>
  <div class="tb-group">
    <button class="big-btn" id="btn-home" aria-label="Voltar para a praça">🏠</button>
  </div>
  <div>
    <div id="steps">
      <div class="step" data-s="1"><i>👂</i><b>Ouvir</b></div>
      <div class="step" data-s="2"><i>✋</i><b>Fazer</b></div>
      <div class="step" data-s="3"><i>🖼️</i><b>Ver</b></div>
      <div class="step" data-s="4"><i>✏️</i><b>Conta</b></div>
    </div>
    <div id="probs"></div>
  </div>
  <div class="tb-group">
    <button class="big-btn" id="btn-ouvir" aria-label="Ouvir de novo">🔊</button>
    <button class="big-btn" id="btn-dica" aria-label="Pedir dica ao Tico"></button>
  </div>
</header>

<div id="legenda" aria-live="polite"></div>
<section id="answer" hidden></section>
<section id="board" hidden>
  <div id="draw"></div>
  <div id="eq"></div>
  <div id="builder" hidden><div id="slots"></div><div id="tiles"></div></div>
  <div class="board-actions" id="board-actions"></div>
</section>
<section id="strategy" hidden></section>

<div id="praca-hud" hidden>
  <div class="tb-group">
    <button class="big-btn" id="who" aria-label="Trocar de jogador">🐶</button>
    <button class="big-btn" id="btn-album" aria-label="Álbum de figurinhas">📒</button>
  </div>
  <div class="tb-group">
    <button class="big-btn" id="btn-festa" aria-label="Festa da Vila" hidden>🎉</button>
    <button class="big-btn" id="btn-ouvir2" aria-label="Ouvir de novo">🔊</button>
    <button class="big-btn" id="btn-adulto" aria-label="Área do professor">⚙️</button>
  </div>
</div>

<section id="start" class="screen">
  <h1>Vila das <span>Contas</span></h1>
  <p class="sub">Quem vai jogar? Toque no seu bichinho.</p>
  <div id="profiles"></div>
  <button class="big-btn adult-link" id="btn-adulto2" aria-label="Área do professor">⚙️</button>
</section>

<section id="gate" class="screen" hidden>
  <button class="hold" id="hold-a" aria-label="Botão esquerdo">✋</button>
  <div class="gtxt">
    <h2>Área do professor</h2>
    Segure os dois botões ao mesmo tempo.<br><small>No computador: segure um botão com o mouse e a tecla Shift.</small>
    <div id="gate-bar"><i></i></div>
    <p><button class="plain" id="gate-close">Voltar ao jogo</button></p>
  </div>
  <button class="hold" id="hold-b" aria-label="Botão direito">✋</button>
</section>

<section id="teacher" class="screen" hidden><div class="panel-wrap" id="teacher-body"></div></section>
<section id="album" class="screen" hidden><div class="panel-wrap" id="album-body"></div></section>
<div id="toast"></div>
<div id="loading">Abrindo a Vila das Contas…</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/core.js"></script>
<script src="js/models.js"></script>
<script src="js/world.js"></script>
<script src="js/missions-a.js"></script>
<script src="js/missions-b.js"></script>
<script src="js/play.js"></script>
<script src="js/ui.js"></script>
